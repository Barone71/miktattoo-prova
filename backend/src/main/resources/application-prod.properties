# Impostazioni per il sito online (attive con SPRING_PROFILES_ACTIVE=prod).

# PostgreSQL: i dati di connessione arrivano dal servizio di hosting.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pochi collegamenti: i database gratuiti ne permettono un numero limitato.
spring.datasource.hikari.maximum-pool-size=5

# Dietro al proxy HTTPS dell'hosting.
server.forward-headers-strategy=framework
