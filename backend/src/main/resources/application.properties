spring.application.name=mik-tattoo-ink-backend
server.port=8080

app.cors.allowed-origin=http://localhost:5173

# Impostazioni locali e segrete (password admin, email...) in backend/.env.properties, escluso da git.
# Online si usano invece le variabili ambiente del servizio di hosting.
spring.config.import=optional:file:.env.properties

# Credenziali del pannello admin (variabili ADMIN_USERNAME e ADMIN_PASSWORD).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Indirizzo a cui arrivano le notifiche delle nuove prenotazioni (variabile NOTIFY_EMAIL).
app.notification.email=${NOTIFY_EMAIL:}

# Invio email tramite SMTP (Brevo, Gmail...). Finché MAIL_HOST è vuoto le email
# non vengono spedite: il contenuto viene solo scritto nel log del server.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}

# Database.
# In locale: H2 salvato nel file backend/data/miktattoo.mv.db, nessuna installazione necessaria.
# Online: impostare SPRING_DATASOURCE_URL (jdbc:postgresql://...), SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/miktattoo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Lo schema lo crea Flyway; Hibernate controlla solo che le entity corrispondano.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Gli orari li gestisce il tatuatore dal pannello admin.
# Con true, all'avvio crea orari di esempio se non ce ne sono di futuri (usato nei test).
app.demo.seed-slots=false
